      <h1>Excelsior</h1>
      <p>Pain Reprocessing Therapy Coaching</p>
      <p>John Vajda is a Pain Reprocessing Therapy Coach at Excelsior LLC. Based in Boulder, Colorado. Coaching by video anywhere.</p>
      <p>Pain Reprocessing Therapy coaching helps people with chronic pain learn how the brain can keep pain going. It is coaching, not medical care, and it does not replace a doctor.</p>
      <h2>The Process</h2>
      <ol>
        <li>Learn the brain's role. Pain is real, and the brain can generate it even without injury.</li>
        <li>Find your own evidence. Notice when pain shifts with stress, mood, rest, or position.</li>
        <li>Befriend the pain. Pay attention with curiosity and calm instead of fear.</li>
        <li>Face what's underneath. Work through the stress, worry, and emotions that keep the alarm on.</li>
        <li>Move toward what feels good. Build positive feelings so the brain gets more safe signals.</li>
      </ol>
      <p>The payoff: as the brain relearns safety, the alarm can quiet down and pain signals can turn down.</p>
      <p>The starter session is one purchase per email address.</p>
      <h2>Questions</h2>
      <p>How does Pain Reprocessing Therapy work? PRT helps you understand that the pain you feel is often driven by the brain misreading safe signals from the body. Through practices like somatic tracking, mindfulness, and emotional awareness, you gradually retrain your brain to interpret these signals accurately, interrupt the pain-fear cycle, and dial down your nervous system's sensitivity.</p>
      <p>Can PRT help if my pain has a physical cause? PRT is designed for neuroplastic pain, but it also helps when structural and stress-related pain overlap. It will not replace necessary medical treatment.</p>
      <p>Is PRT a substitute for medical treatment? No. See your doctor for new, changing, or worrying symptoms.</p>
      <p>Do you coach remotely? Yes. Coaching is by video anywhere. You do not need to be in Boulder, Colorado.</p>
      <p>How do I get started? Book a free 30 minute discovery call.</p>
      <p>What If I have a question? Just email hello@excelsior-prt.com and I'll get back to you!</p>
