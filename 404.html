<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Excelsior LLC</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/shared/posthog.js"></script>
  </head>
  <body class="not-found">
    <aside class="promo-banner" aria-label="Study result">
      <p>
        66% of people were pain-free or nearly pain-free after trying PRT.
        <a href="/#data" data-data-section="banner">See the Data</a>.
      </p>
    </aside>
    <header class="site-header">
      <div class="header-inner">
        <a class="corner-box" href="/">
          <span class="corner-box-title">Excelsior</span>
          <span class="corner-box-sub">LLC</span>
        </a>
        <nav class="site-nav" aria-label="Site">
          <a href="/#options">Options</a>
          <a href="/#process">The Process</a>
          <a href="/#about">About</a>
          <a href="/pages/my-story/" data-my-story="not-found">My Story</a>
          <a
            class="button nav-cta"
            data-discovery-call="not-found"
            href="https://scheduler.zoom.us/excelsior-llc/prt-discovery-call"
            target="_blank"
            rel="noopener noreferrer"
            >Free Discovery Call</a
          >
        </nav>
      </div>
    </header>
    <main>
      <section class="panel not-found-panel">
        <h1>404 — Page not found</h1>
        <p>Uh oh! That page address is not on this site.</p>
        <a class="button" href="/" data-not-found-home>Back to Excelsior</a>
      </section>
    </main>
    <script>
      document.addEventListener("click", (event) => {
        if (!window.posthog) return;
        const story = event.target.closest("[data-my-story]");
        if (story) {
          window.posthog.capture("my_story_clicked", {
            placement: story.getAttribute("data-my-story"),
          });
        }
        const booking = event.target.closest("[data-discovery-call]");
        if (booking) {
          window.posthog.capture("discovery_call_clicked", {
            placement: booking.getAttribute("data-discovery-call"),
          });
        }
        const home = event.target.closest("[data-not-found-home]");
        if (home) window.posthog.capture("not_found_home_clicked");
        const dataSection = event.target.closest("[data-data-section]");
        if (dataSection) {
          window.posthog.capture("data_section_clicked", {
            placement: dataSection.getAttribute("data-data-section"),
          });
        }
      });
    </script>
  </body>
</html>
