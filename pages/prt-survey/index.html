      <h1>PRT Survey</h1>
      <p>Answer all 13 questions in this survey and you will get a result that indicates if you are a good candidate for Pain Reprocessing Therapy and somatic coaching.</p>
      <p>Your answers only occur on this page and are not stored, saved, or sent anywhere.</p>
      <p>This is not medical care and not a diagnosis. It does not promise a result. If you have new, changing, or worrying symptoms, see your doctor first.</p>
      <ol>
        <li>Did your symptoms begin without a preceding injury?</li>
        <li>If your symptoms started with an injury, has pain persisted after the injury's normal course of healing according to your doctor?</li>
        <li>Did your symptoms begin during a stressful time?</li>
        <li>Are your symptoms inconsistent (move or spread around your body, vary in intensity or presentation)?</li>
        <li>Do your symptoms occur after, but not during, an activity or exercise?</li>
        <li>Do you lack a solid physical diagnosis?</li>
        <li>Do you have pain in multiple different parts of your body now, or have you in the past?</li>
        <li>Do you have symptoms that mirror each other (pain in both shoulders, both wrists, both ankles)?</li>
        <li>Does your pain get worse when you're feeling stressed?</li>
        <li>Are you as aware of your symptoms when you are engaged in something enjoyable?</li>
        <li>Does your pain tend to increase during a specific time of day, with a certain activity, or in certain weather?</li>
        <li>Would you describe yourself as anxious, perfectionistic, very conscientious, or a people pleaser?</li>
        <li>Do you have a family history of chronic pain?</li>
      </ol>
      <p>A strong candidate: you look like a strong candidate for Pain Reprocessing Therapy and somatic coaching. You could benefit: you could benefit, and you might not be the strongest candidate. Not a good candidate: you are not a good candidate for this type of coaching. This is not a diagnosis and not a guarantee. Coaching is not medical care.</p>
