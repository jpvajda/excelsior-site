      <h1>My Story</h1>
      <p>John Vajda is a Pain Reprocessing Therapy Coach at Excelsior LLC. Based in Boulder, Colorado. Coaching by video anywhere. Completed the Pain Reprocessing Coaching Training from the Pain Reprocessing Therapy Center, 2026.</p>
      <p>He spent 20 years in tech with neck, wrist, shoulder, and back pain, trained as an amateur racing cyclist in Boulder, Colorado, and later found Pain Reprocessing Therapy after a frozen shoulder in 2026.</p>
      <p><a href="https://excelsior-prt.com/">Excelsior LLC</a></p>
