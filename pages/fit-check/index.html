      <p>66% of people were pain-free or nearly pain-free after trying PRT. <a href="https://excelsior-prt.com/#data">See the Data</a>.</p>
      <h1>Fit Check</h1>
      <p>Answer ten yes or no questions. You get a result on this page about whether you look like a candidate for Pain Reprocessing Therapy and somatic coaching.</p>
      <p>Seven or more yes answers: a strong candidate. Four, five, or six: you could benefit, and you might not be the strongest candidate. Zero to three: not the strongest candidate.</p>
      <p>Your answers stay on this page. They are not saved, and they are not sent. Finishing records only the result band, the same way other button clicks on this site are counted.</p>
      <p>This is not medical care and not a diagnosis. It does not promise a result. If you have new, changing, or worrying symptoms, see your doctor first.</p>
      <ol>
        <li>Do you live with ongoing pain, such as back, shoulder, neck, or joint pain, headaches, or fibromyalgia?</li>
        <li>Do you deal with other lasting symptoms like fatigue, poor sleep, IBS, dizziness, or tinnitus?</li>
        <li>Do you want to calm the fear and stress that amplify your pain, alongside your medical care?</li>
        <li>Do fear, anxiety, or hyper-vigilance amplify what you feel?</li>
        <li>Has pain continued after the body had time to heal, or shown up during a stressful period?</li>
        <li>Do your symptoms shift with stress, mood, rest, or position?</li>
        <li>Are you open to paying attention to a body sensation with calm curiosity instead of fear?</li>
        <li>Are you willing to work through the stress, worry, and emotions that can keep the alarm switched on?</li>
        <li>Can you join coaching by video?</li>
        <li>Do you want coaching alongside your doctor, not as a replacement for medical care?</li>
      </ol>
      <p>A strong candidate: you look like a strong candidate for Pain Reprocessing Therapy and somatic coaching. You could benefit: you could benefit, and you might not be the strongest candidate. Not the strongest candidate: you are not the strongest candidate for this coaching. This is not a diagnosis and not a guarantee. Coaching is not medical care.</p>
